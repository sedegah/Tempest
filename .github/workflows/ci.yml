name: Tempest CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Django System Check
      run: |
        python manage.py check

    - name: Run Tests
      run: |
        python manage.py test
      env:
        SECRET_KEY: 'test-secret-key-for-continuous-integration-pipeline-tempest'
        DEBUG: 'False'
        USE_S3: 'False'
